services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-autoque}"
      POSTGRES_USER: "${POSTGRES_USER:-autoque}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autoque_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  autoque_data:
    name: "${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_autoque_data}"
