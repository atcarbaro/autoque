services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: autoficha
      POSTGRES_USER: autoficha
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - autoficha_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoficha -d autoficha"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  autoficha_data:
